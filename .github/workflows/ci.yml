name: CI — Segurança e Qualidade

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend-and-isolation:
    name: Frontend, NPM Audit e Isolamento
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe JS
        run: node --check src/app.js

      - name: Auditoria de segurança (npm audit)
        run: npm audit --audit-level=moderate

      - name: Validar regras de isolamento e CSP
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const cap = JSON.parse(fs.readFileSync('src-tauri/capabilities/default.json', 'utf8'));
            const html = fs.readFileSync('src/index.html', 'utf8');
            if (conf.app.withGlobalTauri !== false) throw new Error('withGlobalTauri deve ser false');
            if (!conf.app.security?.csp?.includes(\"script-src 'self'\")) throw new Error('CSP script-src self ausente');
            if (JSON.stringify(cap.permissions) !== JSON.stringify(['core:default'])) throw new Error('Permissoes fora de core:default');
            if (/<script(?![^>]*src=)/i.test(html)) throw new Error('Script inline detectado em src/index.html');
            console.log('Isolamento e CSP validados com sucesso.');
          "

  rust-quality-and-audit:
    name: Rust (fmt, clippy, cargo-audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verificar formatação (cargo fmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Análise estática (cargo clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Instalar cargo-audit (binário pré-compilado)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Auditoria de vulnerabilidades Rust (cargo-audit)
        run: cargo audit --file src-tauri/Cargo.lock
